<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Petitguimba | Artiste</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      background:
        radial-gradient(circle at top, #450000 0%, #100000 35%, #050505 75%);
    }

    .card {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .photo {
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid #e00000;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
    }

    h1 {
      margin-top: 30px;
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 900;
      letter-spacing: 5px;
      color: #ff1111;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }

    .style {
      margin-top: 10px;
      font-size: 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ddd;
    }

    .bio {
      max-width: 600px;
      margin: 25px auto;
      color: #aaa;
      font-size: 17px;
      line-height: 1.7;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
    }

    .socials a {
      text-decoration: none;
      color: white;
      border: 1px solid #ff1111;
      padding: 14px 25px;
      border-radius: 30px;
      background: #100000;
      transition: 0.3s;
      font-weight: bold;
    }

    .socials a:hover {
      background: #ff1111;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      transform: translateY(-3px);
    }

    footer {
      margin-top: 45px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="card">

      <img
        src="PETITGUIMBA_1600x1600.jpg"
        alt="Petitguimba"
        class="photo"
      >

      <h1>PETITGUIMBA</h1>

      <div class="style">
        Hip-Hop • Rap • Trap
      </div>

      <p class="bio">
        Bienvenue dans l'univers de Petitguimba.
        Retrouvez ici son actualité, sa musique et ses réseaux.
      </p>

      <div class="socials">

        <a
          href="https://instagram.com/ptg_off"
          target="_blank"
        >
          Instagram
        </a>

        <a
          href="https://www.tiktok.com/@ptg_off93"
          target="_blank"
        >
          TikTok
        </a>

        <a
          href="https://www.snapchat.com/add/ptg_off"
          target="_blank"
        >
          Snapchat
        </a>

      </div>

      <footer>
        © 2026 Petitguimba — Tous droits réservés
      </footer>

    </div>
  </section>

</body>
</html>
